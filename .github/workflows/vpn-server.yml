name: VPN Server (Xray + Tailscale Funnel)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: vpn-server
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install Xray
        run: |
          curl -sL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo mkdir -p /opt/xray
          sudo unzip -o /tmp/xray.zip -d /opt/xray
          sudo chmod +x /opt/xray/xray
          /opt/xray/xray version

      - name: Write Xray config and start server
        env:
          XRAY_UUID: ${{ secrets.XRAY_UUID }}
        run: |
          sudo mkdir -p /opt/xray/etc
          sudo tee /opt/xray/etc/config.json >/dev/null <<EOF
          {
            "log": {"loglevel": "warning"},
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 8081,
                "protocol": "vless",
                "settings": {"clients": [{"id": "${XRAY_UUID}", "level": 8}], "decryption": "none"},
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/ws"}},
                "sniffing": {"enabled": true}
              },
              {
                "listen": "127.0.0.1",
                "port": 8082,
                "protocol": "vless",
                "settings": {"clients": [{"id": "${XRAY_UUID}", "level": 8}], "decryption": "none"},
                "streamSettings": {"network": "xhttp", "xhttpSettings": {"path": "/", "mode": "auto"}},
                "sniffing": {"enabled": true}
              }
            ],
            "outbounds": [
              {"protocol": "freedom", "tag": "direct"},
              {"protocol": "blackhole", "tag": "block"}
            ]
          }
          EOF
          sudo nohup /opt/xray/xray run -c /opt/xray/etc/config.json > /tmp/xray.log 2>&1 &
          sleep 3
          ss -tlnp | grep -E '8081|8082' && echo "XRAY LISTENING OK"

      - name: Start tailscaled (userspace mode) + Join (OAuth -> fresh ephemeral key)
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
        run: |
          curl -sL -o /tmp/ts.tgz https://pkgs.tailscale.com/stable/tailscale_1.104.1_amd64.tgz
          sudo mkdir -p /opt/ts && sudo tar xzf /tmp/ts.tgz -C /opt/ts --strip-components=1
          sudo chmod +x /opt/ts/tailscale /opt/ts/tailscaled
          /opt/ts/tailscale version | head -1
          sudo mkdir -p /tmp/tsstate
          sudo nohup /opt/ts/tailscaled --tun=userspace-networking --statedir=/tmp/tsstate --socket=/tmp/ts.sock > /tmp/tailscaled.log 2>&1 &
          sleep 4
          TS="sudo /opt/ts/tailscale --socket=/tmp/ts.sock"
          ACCESS=$(curl -s -u "${TS_OAUTH_CLIENT_ID}:${TS_OAUTH_CLIENT_SECRET}" \
            -d grant_type=client_credentials https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)
          [ -n "$ACCESS" ] && [ "$ACCESS" != "null" ] || { echo "OAUTH FAILED"; exit 1; }
          KEY=$(curl -s -H "Authorization: Bearer $ACCESS" -H "Content-Type: application/json" \
            -d '{"capabilities":{"devices":{"create":{"preauthorized":true,"reusable":true,"ephemeral":true,"tags":["tag:server"]}}},"expirySeconds":600}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | jq -r .key)
          [ -n "$KEY" ] && [ "$KEY" != "null" ] || { echo "KEY MINT FAILED"; exit 1; }
          echo "::add-mask::$KEY"
          # Force home DERP to Hong Kong (proven working funnel ingress path):
          # blind every other DERP region via /etc/hosts so netcheck can only reach hkg
          curl -s https://controlplane.tailscale.com/derpmap/default -o /tmp/derpmap.json
          jq -r '.Regions | to_entries[] | select(.key != "20") | .value.Nodes[].HostName' /tmp/derpmap.json | sort -u | while read h; do
            echo "127.0.0.1 $h" | sudo tee -a /etc/hosts >/dev/null
          done
          echo "HKG nodes kept: $(jq -r '.Regions["20"].Nodes[].HostName' /tmp/derpmap.json | tr '\n' ' ')"
          echo "blinded $(grep -c '127.0.0.1 derp' /etc/hosts || true) DERP hosts"
          for round in 1 2 3; do
            STALE=$(curl -s -H "Authorization: Bearer $ACCESS" https://api.tailscale.com/api/v2/tailnet/-/devices \
              | jq -r '.devices[] | select(.hostname | startswith("vpn") or startswith("edge")) | .id')
            for id in $STALE; do
              [ -n "$id" ] || continue
              curl -s -X DELETE -H "Authorization: Bearer $ACCESS" "https://api.tailscale.com/api/v2/device/$id" >/dev/null
              echo "deleted stale node $id"
              sleep 2
            done
            $TS up --authkey="$KEY" --hostname=edge1 --accept-dns=false
            SELF_DN=$($TS status --json | jq -r '.Self.DNSName')
            if [ "$SELF_DN" = "edge1.taila273c8.ts.net." ]; then echo "hostname OK: $SELF_DN"; break; fi
            echo "hostname mismatch/collision ($SELF_DN) — deleting self and retrying (round $round)"
            SELF_ID=$($TS status --json | jq -r '.Self.ID')
            curl -s -X DELETE -H "Authorization: Bearer $ACCESS" "https://api.tailscale.com/api/v2/device/$SELF_ID" >/dev/null || true
            sleep 5
          done
          $TS status | head -5

      - name: Enable Funnel (443 -> WS, 8443 -> XHTTP)
        run: |
          TS="sudo /opt/ts/tailscale --socket=/tmp/ts.sock"
          $TS funnel --bg 8081 > /tmp/funnel443.log 2>&1 || sudo cat /tmp/funnel443.log
          $TS funnel --bg --https=8443 http://127.0.0.1:8082 > /tmp/funnel8443.log 2>&1 || sudo cat /tmp/funnel8443.log
          sleep 5
          $TS serve status
          echo "Self DNS: $($TS status --json | jq -r '.Self.DNSName')"

      - name: E2E phase 1 (wait for real public TLS through funnel)
        run: |
          TS="sudo /opt/ts/tailscale --socket=/tmp/ts.sock"
          DN=$($TS status --json | jq -r '.Self.DNSName' | sed 's/\.$//')
          echo "DNS=$DN"
          tls=""
          for i in $(seq 1 54); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "https://$DN/" 2>/dev/null || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "TLS/HTTP healthy after $i checks (HTTP $code)"; tls=1; break; fi
            if [ "$i" -eq 15 ] || [ "$i" -eq 36 ]; then
              echo "[$i] TLS still down — bouncing funnel 443"
              $TS funnel --https=443 off >/dev/null 2>&1 || true
              sleep 3
              $TS funnel --bg 8081 >> /tmp/funnel443.log 2>&1 || true
            fi
            if [ "$i" -eq 48 ]; then
              echo "[$i] bouncing funnel 8443"
              $TS funnel --https=8443 off >/dev/null 2>&1 || true
              sleep 3
              $TS funnel --bg --https=8443 http://127.0.0.1:8082 >> /tmp/funnel8443.log 2>&1 || true
            fi
            if [ $((i % 5)) -eq 0 ]; then
              A=$(dig +short "$DN" @8.8.8.8 2>/dev/null | head -1)
              B=$(dig +short "$DN" @1.1.1.1 2>/dev/null | head -1)
              echo "[$i/54] tls=$code DNS(g8)=$A DNS(11)=$B"
            fi
            sleep 10
          done
          if [ -z "$tls" ]; then
            echo "TLS NEVER BECAME HEALTHY — dumping diagnostics"
            $TS serve status || true
            $TS netcheck 2>&1 | head -30 || true
            sudo tail -40 /tmp/tailscaled.log 2>/dev/null || true
            sudo cat /tmp/funnel443.log /tmp/funnel8443.log /tmp/xray.log 2>/dev/null || true
            exit 1
          fi

      - name: E2E phase 2 (full VLESS probe over WS + XHTTP)
        env:
          XRAY_UUID: ${{ secrets.XRAY_UUID }}
        run: |
          DN=$(sudo /opt/ts/tailscale --socket=/tmp/ts.sock status --json | jq -r '.Self.DNSName' | sed 's/\.$//')
          sudo tee /tmp/probe-ws.json >/dev/null <<EOF
          {"log":{"loglevel":"warning"},"inbounds":[{"listen":"127.0.0.1","port":10821,"protocol":"socks","settings":{"udp":false}}],"outbounds":[{"protocol":"vless","settings":{"vnext":[{"address":"$DN","port":443,"users":[{"id":"${XRAY_UUID}","encryption":"none","level":8}]}]},"streamSettings":{"network":"ws","security":"tls","tlsSettings":{"serverName":"$DN","fingerprint":"chrome"},"wsSettings":{"path":"/ws","host":"$DN"}}}]}
          EOF
          sudo tee /tmp/probe-xh.json >/dev/null <<EOF
          {"log":{"loglevel":"warning"},"inbounds":[{"listen":"127.0.0.1","port":10822,"protocol":"socks","settings":{"udp":false}}],"outbounds":[{"protocol":"vless","settings":{"vnext":[{"address":"$DN","port":8443,"users":[{"id":"${XRAY_UUID}","encryption":"none","level":8}]}]},"streamSettings":{"network":"xhttp","security":"tls","tlsSettings":{"serverName":"$DN","fingerprint":"chrome"},"xhttpSettings":{"path":"/","mode":"auto","host":"$DN"}}}]}
          EOF
          sudo nohup /opt/xray/xray run -c /tmp/probe-ws.json > /tmp/probe-ws.log 2>&1 &
          sudo nohup /opt/xray/xray run -c /tmp/probe-xh.json > /tmp/probe-xh.log 2>&1 &
          sleep 4
          ok=""
          for i in $(seq 1 20); do
            W=$(curl -s --max-time 20 --socks5-hostname 127.0.0.1:10821 https://api.ipify.org || true)
            X=$(curl -s --max-time 20 --socks5-hostname 127.0.0.1:10822 https://api.ipify.org || true)
            if [ -n "$W" ] && [ -n "$X" ]; then ok=1; echo "attempt $i: WS=$W XHTTP=$X"; break; fi
            echo "attempt $i: probes pending..."
            sleep 15
          done
          if [ -z "$ok" ]; then
            echo "E2E PROBES FAILED — dumping diagnostics"
            sudo /opt/ts/tailscale --socket=/tmp/ts.sock serve status || true
            sudo cat /tmp/funnel443.log /tmp/funnel8443.log /tmp/xray.log /tmp/probe-ws.log /tmp/probe-xh.log 2>/dev/null || true
            exit 1
          fi
          echo "WS   gstatic: $(curl -s --max-time 20 --socks5-hostname 127.0.0.1:10821 -o /dev/null -w '%{http_code}' https://www.gstatic.com/generate_204)"
          echo "XHTTP gstatic: $(curl -s --max-time 20 --socks5-hostname 127.0.0.1:10822 -o /dev/null -w '%{http_code}' https://www.gstatic.com/generate_204)"

      - name: Send configs to Telegram + Summary
        env:
          XRAY_UUID: ${{ secrets.XRAY_UUID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          DN=$(sudo /opt/ts/tailscale --socket=/tmp/ts.sock status --json | jq -r '.Self.DNSName' | sed 's/\.$//')
          WS="vless://${XRAY_UUID}@${DN}:443?encryption=none&security=tls&sni=${DN}&fp=chrome&type=ws&host=${DN}&path=%2Fws#GH-Funnel-WS"
          XH="vless://${XRAY_UUID}@${DN}:8443?encryption=none&security=tls&sni=${DN}&fp=chrome&type=xhttp&path=%2F&mode=auto&host=${DN}#GH-Funnel-XHTTP"
          {
            echo "## ✅ VPN Server ONLINE"
            echo ""
            echo "- Node: **${DN}**"
            echo "- WS: 443 → /ws | XHTTP: 8443 → /"
            echo "- Auto-renewed by self-chaining (~5.5h), cron backstop"
            echo ""
            echo "🔐 Full vless configs were sent to your Telegram."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            MSG="✅ VPN Server (GitHub Action) ONLINE"$'\n\n'"${WS}"$'\n\n'"${XH}"$'\n\n'"♻️ خودکار تازه‌سازی میشه (زنجیره‌ی ۲۴/۷) — کانفیگ‌ها ثابتن و همینه."
            curl -sG "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${MSG}" > /tmp/tg.json
            grep -q '"ok":true' /tmp/tg.json && echo "TELEGRAM SENT OK" || { echo "TELEGRAM FAILED:"; cat /tmp/tg.json; }
          else
            echo "TG secrets not set, skipping telegram"
          fi

      - name: Keep alive (watchdog + pre-chain at min 310)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 315); do
            pgrep -x xray >/dev/null || {
              echo "[$i] xray died — respawning"
              sudo nohup /opt/xray/xray run -c /opt/xray/etc/config.json >> /tmp/xray.log 2>&1 &
            }
            if ! sudo /opt/ts/tailscale --socket=/tmp/ts.sock status >/dev/null 2>&1; then
              echo "[$i] tailscale down — restarting daemon + funnel"
              sudo pkill -x tailscaled 2>/dev/null || true
              sudo rm -f /tmp/ts.sock
              sudo nohup /opt/ts/tailscaled --tun=userspace-networking --statedir=/tmp/tsstate --socket=/tmp/ts.sock >> /tmp/tailscaled.log 2>&1 &
              sleep 4
              sudo /opt/ts/tailscale --socket=/tmp/ts.sock up --accept-dns=false --hostname=edge1 || true
              sudo /opt/ts/tailscale --socket=/tmp/ts.sock funnel --bg 8081 >> /tmp/funnel443.log 2>&1 || true
              sudo /opt/ts/tailscale --socket=/tmp/ts.sock funnel --bg --https=8443 http://127.0.0.1:8082 >> /tmp/funnel8443.log 2>&1 || true
            fi
            if [ "$i" -eq 310 ]; then
              PENDING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vpn-server.yml/runs?per_page=15" \
                | jq --arg rid "${{ github.run_id }}" '[.workflow_runs[] | select((.id | tostring) != $rid and (.status == "queued" or .status == "in_progress"))] | length')
              if [ "$PENDING" = "0" ]; then
                HTTP=$(curl -s -o /tmp/chain.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vpn-server.yml/dispatches" \
                  -d '{"ref":"main"}')
                echo "pre-chain dispatch HTTP $HTTP $(cat /tmp/chain.json)"
              else
                echo "pre-chain skipped: $PENDING run(s) already active"
              fi
            fi
            if [ $((i % 30)) -eq 0 ]; then echo "[$i/315] alive — $(curl -s --max-time 10 --socks5-hostname 127.0.0.1:10821 https://api.ipify.org || echo probe-down)"; fi
            sleep 60
          done

      - name: Chain next run (success fallback)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PENDING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vpn-server.yml/runs?per_page=15" \
            | jq --arg rid "${{ github.run_id }}" '[.workflow_runs[] | select((.id | tostring) != $rid and (.status == "queued" or .status == "in_progress"))] | length')
          if [ "$PENDING" = "0" ]; then
            HTTP=$(curl -s -o /tmp/chain2.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vpn-server.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "fallback chain dispatch HTTP $HTTP $(cat /tmp/chain2.json)"
          else
            echo "a run is already queued/in-progress ($PENDING) — chain skipped"
          fi

      - name: Self-heal restart on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "run failed — self-heal: cooling down 3 min then dispatching a fresh run"
          curl -sG "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=⚠️ VPN run failed — self-heal فعال شد، ۳ دقیقه بعد run تازه بالا میاد." >/dev/null 2>&1 || true
          sleep 180
          PENDING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vpn-server.yml/runs?per_page=15" \
            | jq --arg rid "${{ github.run_id }}" '[.workflow_runs[] | select((.id | tostring) != $rid and (.status == "queued" or .status == "in_progress"))] | length')
          if [ "$PENDING" = "0" ]; then
            HTTP=$(curl -s -o /tmp/heal.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vpn-server.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "self-heal dispatch HTTP $HTTP $(cat /tmp/heal.json)"
          else
            echo "a run is already active ($PENDING) — self-heal dispatch skipped"
          fi
